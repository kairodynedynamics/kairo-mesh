name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test

  android:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # the demo build is the one handed out (release settings, unsigned here: the upload key never leaves the owner)
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDemo
      - run: node interop-check.mjs
      - uses: actions/upload-artifact@v4
        with: { name: KairoMesh-android-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }

  swift-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0-jammy
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios:
    # macos-26 pool: on 2026-11-16 macos-15 had no capacity and the Intel pool cut jobs mid-step. The app is built and uploaded
    # before the slow simulator tests, so a cut-off run still leaves a downloadable build.
    runs-on: macos-26
    timeout-minutes: 75
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Core on macOS (CryptoKit)
        run: swift test
      - name: "Interop: JavaScript reads the Swift node's frames"
        run: node ../android/interop-check.mjs .build/interop-from-swift.json
      - name: Generate the Xcode project
        run: brew install xcodegen && cd App && xcodegen generate
      - name: Pick two different simulators (an iPhone and an iPad)
        id: sims
        run: |
          pick() { xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in ds if d['name'].startswith('$1')))"; }
          echo "iphone=$(pick iPhone)" >> "$GITHUB_OUTPUT"
          echo "ipad=$(pick iPad)" >> "$GITHUB_OUTPUT"
      - name: Build the app for the simulator (downloadable)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild build -project KairoMesh.xcodeproj -scheme KairoMesh -configuration Debug -sdk iphonesimulator \
            -derivedDataPath ../.build/dd | tail -3
          cd ../.build/dd/Build/Products/Debug-iphonesimulator && ditto -c -k --keepParent KairoMesh.app ../../../../KairoMesh-simulator.zip
      - uses: actions/upload-artifact@v4
        with: { name: KairoMesh-ios-simulator, path: ios/.build/KairoMesh-simulator.zip }
      - name: Build the unsigned demo IPA (Demo configuration; sideload with AltStore/Sideloadly, which sign it with the user's Apple ID)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild build -project KairoMesh.xcodeproj -scheme KairoMesh -configuration Demo -sdk iphoneos             -destination 'generic/platform=iOS' -derivedDataPath ../.build/dd-cihaz             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -3
          cd ../.build && rm -rf Payload && mkdir Payload && cp -R dd-cihaz/Build/Products/Demo-iphoneos/KairoMesh.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload KairoMesh-imzasiz.ipa && ls -l KairoMesh-imzasiz.ipa
      - uses: actions/upload-artifact@v4
        with: { name: KairoMesh-ios-ipa-imzasiz, path: ios/.build/KairoMesh-imzasiz.ipa }
      - name: All tests on iPhone, unit tests on iPad
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild test -project KairoMesh.xcodeproj -scheme KairoMesh \
            -destination "id=${{ steps.sims.outputs.iphone }}" \
            -resultBundlePath ../.build/results-iphone.xcresult | tail -40
          exit ${PIPESTATUS[0]}
      - name: Unit tests on iPad
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild test -project KairoMesh.xcodeproj -scheme KairoMesh \
            -destination "id=${{ steps.sims.outputs.ipad }}" \
            -skip-testing KairoMeshUITests \
            -resultBundlePath ../.build/results-ipad.xcresult | tail -40
          exit ${PIPESTATUS[0]}
      - name: Failure details
        if: failure()
        run: |
          for r in .build/results-iphone.xcresult .build/results-ipad.xcresult; do
            [ -d "$r" ] || continue
            echo "=== $r ==="
            xcrun xcresulttool get test-results tests --path "$r" > .build/tests.json
            python3 - <<'PY'
          import json
          def walk(n, path):
              path = path + ' / ' + n.get('name', '')
              if n.get('nodeType') == 'Failure Message':
                  print(path)
              for c in n.get('children', []):
                  walk(c, path)
          for n in json.load(open('.build/tests.json')).get('testNodes', []):
              walk(n, '')
          PY
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-test-results, path: ios/.build/results-*.xcresult, if-no-files-found: ignore }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="Animation: a sealed message is handed to a passer-by, carried between two neighbourhoods and delivered to the recipient">
  <style>
    .fg { fill: #6e7781; } .muted { fill: #8b949e; } .zone { fill: #2da77a; fill-opacity: .10; stroke: #2da77a; stroke-opacity: .5; }
    .ring { fill: none; stroke: #2da77a; stroke-opacity: .6; } .node { fill: #8b949e; } .courier { fill: #2da77a; }
    .env { fill: #f2b134; stroke: #57606a; stroke-width: 1.2; } .path { fill: none; stroke: #8b949e; stroke-opacity: .7; stroke-dasharray: 3 7; }
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  </style>

  <!-- two neighbourhoods, out of radio range of each other -->
  <circle class="zone" cx="150" cy="130" r="105"/>
  <circle class="zone" cx="610" cy="130" r="105"/>
  <text class="muted" x="150" y="258" font-size="13" text-anchor="middle">Neighbourhood A</text>
  <text class="muted" x="610" y="258" font-size="13" text-anchor="middle">Neighbourhood B</text>
  <text class="muted" x="380" y="52" font-size="13" text-anchor="middle">no network · out of radio range</text>
  <path class="path" d="M190 150 C 300 215, 460 60, 570 130"/>

  <!-- bystanders -->
  <circle class="node" opacity=".3" cx="95" cy="95" r="6"/>
  <circle class="node" opacity=".3" cx="185" cy="80" r="6"/>
  <circle class="node" opacity=".3" cx="120" cy="190" r="6"/>
  <circle class="node" opacity=".3" cx="660" cy="85" r="6"/>
  <circle class="node" opacity=".3" cx="585" cy="195" r="6"/>
  <circle class="node" opacity=".3" cx="675" cy="175" r="6"/>

  <!-- sender -->
  <circle class="ring" cx="130" cy="150" r="10">
    <animate attributeName="r" values="10;34" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".55;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle class="node" cx="130" cy="150" r="9"/>
  <text class="fg" x="130" y="128" font-size="13" font-weight="600" text-anchor="middle">Sender</text>

  <!-- recipient: flashes when the message arrives -->
  <circle class="ring" cx="630" cy="130" r="10" stroke-width="2">
    <animate attributeName="r" values="10;10;44;44" keyTimes="0;.8;.92;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;.9;0;0" keyTimes="0;.8;.81;.92;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle class="node" cx="630" cy="130" r="9"/>
  <text class="fg" x="630" y="108" font-size="13" font-weight="600" text-anchor="middle">Recipient</text>

  <!-- courier walks from A to B -->
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.2;.72;1"
      path="M190 150 C 300 215, 460 60, 570 130"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.95;1" dur="10s" repeatCount="indefinite"/>
    <circle class="ring" r="10">
      <animate attributeName="r" values="10;34" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".55;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle class="courier" r="9"/>
    <text class="fg" y="30" font-size="12" text-anchor="middle">Courier</text>
  </g>

  <!-- the sealed envelope: sender, then courier, then recipient -->
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;.107;.107;.893;.893;1;1" keyTimes="0;.1;.18;.2;.72;.76;.82;1"
      path="M130 150 L190 150 C 300 215, 460 60, 570 130 L630 130"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.84;.9;1" dur="10s" repeatCount="indefinite"/>
    <rect class="env" x="-9" y="-24" width="18" height="13" rx="2"/>
    <path d="M-9 -24 L0 -16 L9 -24" fill="none" stroke="#57606a" stroke-width="1.2"/>
  </g>

  <!-- captions -->
  <g font-size="15" text-anchor="middle" class="fg">
    <text x="380" y="24" opacity="0">1 · Message is sealed for the recipient
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.17;.2;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="380" y="24" opacity="0">2 · A passer-by who often meets the recipient carries it, unable to read it
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.23;.69;.72;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="380" y="24" opacity="0">3 · Delivered · the recipient's receipt makes couriers drop their copies
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.74;.78;.96;1" dur="10s" repeatCount="indefinite"/></text>
  </g>
</svg>

# XcodeGen spec for the iOS app (Xcode projects are generated, not committed):
#   brew install xcodegen && cd ios/App && xcodegen generate
name: KairoMesh
options:
  bundleIdPrefix: com.kairodyne
  deploymentTarget:
    iOS: "16.0"
packages:
  KairoCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5"
    # ad-hoc "sign to run locally": the simulator refuses Keychain access to unsigned apps
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "YES" # the test bundles have no Info.plist of their own
targets:
  KairoMesh:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets # app icon (site/marka/uret.py)
      # on-device triage model (triyaj/model.py agirlik): weights and labels
      - path: ../../triyaj/telefon/triyaj.json
        buildPhase: resources
      - path: ../../triyaj/telefon/triyaj.bin
        buildPhase: resources
      # the Turkish encoder (triyaj/kodlayici.py telefon): message-level decisions, 23.5 MB
      - path: ../../triyaj/telefon/kodlayici.json
        buildPhase: resources
      - path: ../../triyaj/telefon/kodlayici.bin
        buildPhase: resources
      - path: ../../triyaj/telefon/kodlayici-kelime.bin
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # GENERATE_INFOPLIST_FILE takes the bundle version from these, overriding Info.plist; iOS will not
        # install a bundle without CFBundleVersion (same numbers as the Android build)
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "4"
    dependencies:
      - package: KairoCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: KairoMesh
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: KairoMesh, yakındaki telefonlar arasında şifreli mesajları Bluetooth ile taşır.
        NSLocationWhenInUseUsageDescription: Acil yardım çağrınıza konumunuz eklenir; GPS internet olmadan da çalışır.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
  KairoCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../Tests/KairoCoreTests]
    dependencies:
      - package: KairoCore
  KairoMeshUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: KairoMesh
schemes:
  KairoMesh:
    build:
      targets:
        KairoMesh: all
    test:
      targets: [KairoCoreTests, KairoMeshUITests]
